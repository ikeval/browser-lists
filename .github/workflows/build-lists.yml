# Builds the lists every day and publishes them to GitHub Pages
# (https://lists.keval.ca). If a build fails, nothing is published, and the
# site keeps serving the previous lists.
name: Build lists

on:
  schedule:
    - cron: "17 6 * * *" # Daily at 06:17 UTC.
  workflow_dispatch: # Lets you run it by hand from the Actions tab.
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two publishes at once.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The SafariConverterLib release to convert with. Change it to upgrade.
  CONVERTER_VERSION: v4.3.1

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Building the converter takes a few minutes, so keep it between runs.
      - name: Restore ConverterTool
        id: cache
        uses: actions/cache@v4
        with:
          path: converter
          key: converter-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.CONVERTER_VERSION }}

      - name: Build ConverterTool
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          source="$RUNNER_TEMP/SafariConverterLib"
          git clone --depth 1 --branch "$CONVERTER_VERSION" https://github.com/AdguardTeam/SafariConverterLib "$source"
          swift build -c release --package-path "$source" --product ConverterTool
          # .build/release is a symlink, so ask SwiftPM for the real folder.
          bin=$(swift build -c release --package-path "$source" --show-bin-path)
          mkdir -p converter
          cp "$bin/ConverterTool" converter/
          # The tool loads these resource bundles from next to itself.
          # The glob fails the step if there are none, rather than caching a broken tool.
          cp -R "$bin"/*.bundle converter/

      - name: Build lists
        run: bash scripts/build-lists.sh
        env:
          CONVERTER: converter/ConverterTool

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4